services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: edumarket_user
      POSTGRES_PASSWORD: edumarket_password
      POSTGRES_DB: edumarket_db
    ports:
      - "5432:5432"
    volumes:
      - edumarket_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://edumarket_user:edumarket_password@db:5432/edumarket_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  edumarket_pgdata:
